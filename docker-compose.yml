services:
  postgres:
    image: postgres:17
    container_name: biocompiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 🌟 CORREÇÃO 1: Adiciona o teste de saúde do banco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/biocompiler
      dockerfile: Dockerfile
    container_name: biocompiler-backend
    # 🌟 CORREÇÃO 2: Só inicia o backend quando o postgres estiver 100% pronto
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      PORT: ${BACKEND_PORT}
      SERVER_PORT: ${BACKEND_PORT}
      
      # 🌟 ADICIONE ESTAS CONFIGURAÇÕES DO HIKARI POOL:
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000        # 10 minutos em milissegundos
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 300000        # 5 minutos em milissegundos
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
    ports:
      - "${BACKEND_PORT}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/biocompiler
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: biocompiler-frontend
    depends_on:
      - backend
    environment:
      PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    restart: unless-stopped

volumes:
  postgres-data:
