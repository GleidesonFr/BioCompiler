services:
  - type: web
    name: biocompiler-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend/biocompiler
    dockerfilePath: ./backend/biocompiler/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: biocompiler-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: biocompiler-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend/biocompiler
    dockerfilePath: ./frontend/biocompiler/Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: biocompiler-api
          envVarKey: RENDER_EXTERNAL_URL
